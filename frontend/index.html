<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TaskFlow — Tablero (s11)</title>
  <!-- CSS mínimo: solo lo necesario para ver columnas y tarjetas. Nada elaborado. -->
  <style>
    body { font-family: system-ui, sans-serif; margin: 1.5rem; color: #1c2024; }
    h1 { font-size: 1.4rem; }
    .hint { color: #667; font-size: .85rem; margin-bottom: 1rem; }

    form { margin-bottom: 1.5rem; display: flex; gap: .5rem; flex-wrap: wrap; }
    input { padding: .4rem .6rem; font-size: 1rem; }
    button { padding: .4rem .8rem; font-size: 1rem; cursor: pointer; }

    .tablero { display: flex; gap: 1rem; align-items: flex-start; }
    .columna { flex: 1; background: #f1f3f5; border-radius: 8px; padding: .6rem; min-height: 120px; }
    .columna h2 { font-size: .95rem; margin: .2rem 0 .8rem; text-transform: capitalize; }

    .tarjeta {
      background: #fff; border: 1px solid #dcdfe4; border-radius: 6px;
      padding: .5rem .6rem; margin-bottom: .5rem; cursor: pointer;
      box-shadow: 0 1px 2px rgba(0,0,0,.05);
    }
    .tarjeta:hover { border-color: #8b9096; }
    .tarjeta .titulo { font-weight: 600; }
    .tarjeta .desc { color: #667; font-size: .85rem; margin-top: .2rem; }
  </style>
</head>
<body>
  <h1>TaskFlow — Tablero</h1>
  <p class="hint">
    s12: tablero conectado a la API v1 con <code>fetch</code> (requiere la API en
    <code>:8000</code> y este front servido en <code>:3000</code>).
    Hacé <strong>click en una tarjeta</strong> para moverla de columna.
  </p>

  <!-- Form para crear tareas: la tarea vive solo en memoria del navegador. -->
  <form id="form-tarea">
    <input id="input-titulo" type="text" placeholder="Título de la tarea" required />
    <input id="input-desc" type="text" placeholder="Descripción (opcional)" />
    <button type="submit">Agregar tarea</button>
  </form>

  <!-- Las tres columnas del tablero. app.js llena cada una con tarjetas. -->
  <div class="tablero">
    <section class="columna" id="col-backlog"><h2>backlog</h2></section>
    <section class="columna" id="col-en-progreso"><h2>en progreso</h2></section>
    <section class="columna" id="col-hecho"><h2>hecho</h2></section>
  </div>

  <script src="app.js"></script>
</body>
</html>
